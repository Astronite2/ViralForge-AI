name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint with Ruff
        run: ruff check backend alembic
      - name: Check formatting
        run: black --check backend alembic
      - name: Run tests
        run: pytest
      - name: Build API image
        run: docker build --tag viralforge-api:ci .
