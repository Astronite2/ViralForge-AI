name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    env:
      AI_REASONING_ENABLED: "false"
      AI_API_KEY: ""
      OPENAI_API_KEY: ""
      YOUTUBE_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check backend alembic scripts

      - name: Check Black formatting
        run: python -m black --check backend alembic scripts

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Validate Alembic lifecycle
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/viralforge-ci-alembic.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

  backend-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viralforge_ci
          POSTGRES_USER: viralforge_ci
          POSTGRES_PASSWORD: viralforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viralforge_ci -d viralforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://viralforge_ci:viralforge_ci@localhost:5432/viralforge_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET: ci-only-jwt-secret
      AI_REASONING_ENABLED: "false"
      AI_API_KEY: ""
      OPENAI_API_KEY: ""
      YOUTUBE_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Upgrade PostgreSQL schema
        run: python -m alembic upgrade head

      - name: Run PostgreSQL persistence and readiness smoke test
        run: python -m backend.scripts.ci_postgres_smoke

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tracked files and obvious secrets
        run: python3 scripts/check_repository_hygiene.py

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag viralforge-api:ci .

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-quality
      - backend-postgres
      - frontend
      - repository-hygiene
      - docker
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_QUALITY: ${{ needs.backend-quality.result }}
          BACKEND_POSTGRES: ${{ needs.backend-postgres.result }}
          FRONTEND: ${{ needs.frontend.result }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          for result in "$BACKEND_QUALITY" "$BACKEND_POSTGRES" "$FRONTEND" "$REPOSITORY_HYGIENE" "$DOCKER"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not pass."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
